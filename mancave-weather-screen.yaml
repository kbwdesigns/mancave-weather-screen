      - lvgl.label.update:
          id: main_day4_icon
          text: !lambda |-
            std::string c = id(fc4_cond).state;
            for (char &ch : c) ch = tolower(ch);
            if (c.find("fog") != std::string::npos || c.find("mist") != std::string::npos) return "\uF014";
            if (c.find("sunny") != std::string::npos || c.find("clear") != std::string::npos) return "\uF00D";
            if (c.find("partly") != std::string::npos) return "\uF002";
            if (c.find("cloud") != std::string::npos || c.find("overcast") != std::string::npos) return "\uF013";
            if (c.find("rain") != std::string::npos || c.find("pour") != std::string::npos || c.find("shower") != std::string::npos) return "\uF019";
            if (c.find("thunder") != std::string::npos || c.find("lightning") != std::string::npos || c.find("storm") != std::string::npos) return "\uF01E";
            if (c.find("snow") != std::string::npos) return "\uF01B";
            return "\uF013";
          text_color: !lambda |-
            std::string c = id(fc4_cond).state;
            for (char &ch : c) ch = tolower(ch);
            if (c.find("sunny") != std::string::npos || c.find("clear") != std::string::npos) return lv_color_hex(0xFFCC00);
            if (c.find("partly") != std::string::npos) return lv_color_hex(0xFFCC00);
            if (c.find("cloud") != std::string::npos || c.find("overcast") != std::string::npos) return lv_color_hex(0xAAAAAA);
            if (c.find("rain") != std::string::npos || c.find("pour") != std::string::npos || c.find("shower") != std::string::npos) return lv_color_hex(0x4FC3F7);
            if (c.find("thunder") != std::string::npos || c.find("lightning") != std::string::npos || c.find("storm") != std::string::npos) return lv_color_hex(0x7E57C2);
            if (c.find("snow") != std::string::npos) return lv_color_hex(0xE0E0E0);
            if (c.find("fog") != std::string::npos || c.find("mist") != std::string::npos) return lv_color_hex(0x90A4AE);
            return lv_color_hex(0xAAAAAA);
      - lvgl.label.update:
          id: main_day4_low
          text: !lambda 'return std::to_string((int)id(fc4_low).state) + "°";'
      - lvgl.label.update:
          id: main_day4_high
          text: !lambda 'return std::to_string((int)id(fc4_high).state) + "°";'
      - lvgl.bar.update:
          id: main_day4_bar
          value: !lambda 'return (int)id(fc4_high).state;'
      - lvgl.widget.update:
          id: main_day4_bar
          indicator:
            bg_color: !lambda |-
              int t = (int)id(fc4_high).state;
              if (t <= 40) return lv_color_hex(0x1565C0);
              if (t <= 55) return lv_color_hex(0x4FC3F7);
              if (t <= 70) return lv_color_hex(0x66BB6A);
              if (t <= 85) return lv_color_hex(0xFFAA00);
              return lv_color_hex(0xEF5350);
            bg_grad_dir: NONE
      # Range bars: each bar spans that day's low..high on a shared weekly scale
      - lambda: |-
          float lo[5] = {id(fc0_low).state, id(fc1_low).state, id(fc2_low).state, id(fc3_low).state, id(fc4_low).state};
          float hi[5] = {id(fc0_high).state, id(fc1_high).state, id(fc2_high).state, id(fc3_high).state, id(fc4_high).state};
          lv_obj_t *bars[5] = {id(main_day0_bar), id(main_day1_bar), id(main_day2_bar), id(main_day3_bar), id(main_day4_bar)};
          int wmin = 999, wmax = -999;
          for (int i = 0; i < 5; i++) {
            if (std::isnan(lo[i]) || std::isnan(hi[i])) continue;
            wmin = std::min(wmin, (int) lroundf(lo[i]));
            wmax = std::max(wmax, (int) lroundf(hi[i]));
          }
          if (wmin > wmax) return;           // no valid data yet
          if (wmax - wmin < 10) wmax = wmin + 10;  // avoid a too-zoomed scale
          for (int i = 0; i < 5; i++) {
            lv_obj_t *b = bars[i];
            lv_bar_set_mode(b, LV_BAR_MODE_RANGE);
            lv_bar_set_range(b, wmin, wmax);
            if (std::isnan(lo[i]) || std::isnan(hi[i])) {
              lv_bar_set_start_value(b, wmin, LV_ANIM_OFF);
              lv_bar_set_value(b, wmin, LV_ANIM_OFF);
              continue;
            }
            int l = (int) lroundf(lo[i]), h = (int) lroundf(hi[i]);
            if (h < l) std::swap(h, l);
            lv_bar_set_value(b, h, LV_ANIM_OFF);
            lv_bar_set_start_value(b, l, LV_ANIM_OFF);
          }
      - script.execute: update_daily_precip

