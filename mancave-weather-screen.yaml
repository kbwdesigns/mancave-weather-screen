text_sensor:
  - platform: homeassistant
    entity_id: ${ha_wind_direction}
    id: ha_current_wind_direction
    on_value:
      then:
        - lvgl.label.update:
            id: current_wind_direction
            text:
              format: "%s"
              args: ['x.c_str()']

  - platform: homeassistant
    entity_id: ${ha_condition}
    id: ha_current_condition
    on_value:
      then:
        # Animated condition icon: pick the matching animation 
        - lambda: |-
            std::string cond = x;
            for (char &c : cond) c = tolower(c);
            static const char *known[] = {"sunny","clear-night","partlycloudy","cloudy","rainy","pouring",
              "lightning","lightning-rainy","snowy","snowy-rainy","fog","windy","hail","exceptional"};
            bool ok = false;
            for (auto k : known) if (cond == k) { ok = true; break; }
            if (!ok) {
              // fallback for non-standard strings (same keyword logic as the old font icon)
              if (cond.find("fog") != std::string::npos) cond = "fog";
              else if (cond.find("sunny") != std::string::npos || cond.find("clear") != std::string::npos) cond = "sunny";
              else if (cond.find("partly") != std::string::npos) cond = "partlycloudy";
              else if (cond.find("storm") != std::string::npos || cond.find("thunder") != std::string::npos) cond = "lightning-rainy";
              else if (cond.find("rain") != std::string::npos || cond.find("shower") != std::string::npos) cond = "rainy";
              else if (cond.find("snow") != std::string::npos) cond = "snowy";
              else cond = "cloudy";
            }
            id(weather_cond) = cond;
        - lambda: |-
            std::string c = id(weather_cond);
            if (c == "pouring") c = "rainy";
            struct E { const char *n; lv_obj_t *o; };
            E all[] = {
              {"sunny", id(ai_sunny)},
              {"clear-night", id(ai_clear_night)},
              {"partlycloudy", id(ai_partlycloudy)},
              {"cloudy", id(ai_cloudy)},
              {"rainy", id(ai_rainy)},
              {"lightning", id(ai_lightning)},
              {"lightning-rainy", id(ai_lightning_rainy)},
              {"snowy", id(ai_snowy)},
              {"snowy-rainy", id(ai_snowy_rainy)},
              {"fog", id(ai_fog)},
              {"windy", id(ai_windy)},
              {"hail", id(ai_hail)},
              {"exceptional", id(ai_exceptional)},
            };
            bool found = false;
            for (auto &e : all) if (c == e.n) found = true;
            if (!found) c = "cloudy";
            for (auto &e : all) {
              if (c == e.n) lv_obj_clear_flag(e.o, LV_OBJ_FLAG_HIDDEN);
              else lv_obj_add_flag(e.o, LV_OBJ_FLAG_HIDDEN);
            }

