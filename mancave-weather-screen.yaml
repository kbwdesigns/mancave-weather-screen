# ESP32-S3-Touch-LCD-7
# 16MB flash layout (already installed over USB with v6); Wi-Fi OTA is fine from here on
substitutions:
  # Your location for the Sun page sun-path math (decimal degrees, west longitude negative)
  latitude: "0.0"
  longitude: "0.0"
  tempscale: "°F"
  humidityscale: "%"

  # Indoor
  ha_indoor_temp: sensor.mancave_ble_temperature
  ha_indoor_humidity: sensor.mancave_ble_humidity

  # Outdoor / deck
  ha_deck_temp: sensor.deck_temperature_temperature
  ha_deck_humidity: sensor.deck_temperature_humidity

  # Ecowitt rain / pressure
  ha_event_rain: sensor.gw1100b_event_rain
  ha_rain_rate: sensor.gw1100b_rain_rate
  ha_pressure: sensor.gw1100b_relative_pressure

  # Current weather
  ha_wind_speed: sensor.current_wind_speed
  ha_wind_direction: sensor.current_wind_direction
  ha_condition: sensor.openweathermap_condition

  # 5-day forecast
  ha_forecast_day_0_low: sensor.forecast_day_0_low
  ha_forecast_day_0_high: sensor.forecast_day_0_high
  ha_forecast_day_0_condition: sensor.forecast_day_0_condition
  ha_forecast_day_1_low: sensor.forecast_day_1_low
  ha_forecast_day_1_high: sensor.forecast_day_1_high
  ha_forecast_day_1_condition: sensor.forecast_day_1_condition
  ha_forecast_day_2_low: sensor.forecast_day_2_low
  ha_forecast_day_2_high: sensor.forecast_day_2_high
  ha_forecast_day_2_condition: sensor.forecast_day_2_condition
  ha_forecast_day_3_low: sensor.forecast_day_3_low
  ha_forecast_day_3_high: sensor.forecast_day_3_high
  ha_forecast_day_3_condition: sensor.forecast_day_3_condition
  ha_forecast_day_4_low: sensor.forecast_day_4_low
  ha_forecast_day_4_high: sensor.forecast_day_4_high
  ha_forecast_day_4_condition: sensor.forecast_day_4_condition

  # Hourly wind
  ha_forecast_hour_0_wind_speed: sensor.forecast_hour_0_wind_speed
  ha_forecast_hour_0_wind_direction: sensor.forecast_hour_0_wind_direction
  ha_forecast_hour_1_wind_speed: sensor.forecast_hour_1_wind_speed
  ha_forecast_hour_1_wind_direction: sensor.forecast_hour_1_wind_direction
  ha_forecast_hour_2_wind_speed: sensor.forecast_hour_2_wind_speed
  ha_forecast_hour_2_wind_direction: sensor.forecast_hour_2_wind_direction
  ha_forecast_hour_3_wind_speed: sensor.forecast_hour_3_wind_speed
  ha_forecast_hour_3_wind_direction: sensor.forecast_hour_3_wind_direction

  # Sun and moon
  ha_sun: sun.sun
  ha_moon: sensor.moon

  # Template sensors
  ha_daily_precip: sensor.mancave_daily_precip
  ha_hourly_4h: sensor.mancave_hourly_4h

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y

esphome:
  name: mancave-screen
  on_boot:
    # Boot splash: KBW Designs logo for 5s, then the main page.
    # (page_splash is the first LVGL page, so it is what shows at power-up.)
    - priority: -100
      then:
        - lvgl.page.show: page_splash
        - delay: 5s
        - lvgl.page.show: page_main
  build_flags:
    - "-DBOARD_HAS_PSRAM"
  platformio_options:
    build_unflags: -Werror=all
    board_build.flash_mode: dio
    board_build.esp-idf.memory_type: qio_opi
    board_upload.maximum_ram_size: 524288
    board_build.flash_size: 16MB

api:
  encryption:
    key: !secret mancave_weather_api_key

ota:
  - platform: esphome
    password: !secret mancave_weather_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:
  level: DEBUG
  hardware_uart: UART0

psram:
  mode: octal
  speed: 80MHz

ch422g:
  - id: io_ex

i2c:
  sda: 8
  scl: 9
  frequency: 400kHz
  scan: true
  id: bus_a

touchscreen:
  platform: gt911
  address: 0x5D
  id: my_touchscreen
  update_interval: 16ms
  interrupt_pin: 4
  reset_pin:
    ch422g: io_ex
    number: 1

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: device_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHz
    dimensions:
      width: 800
      height: 480
    reset_pin:
      ch422g: io_ex
      number: 3
    enable_pin:
      ch422g: io_ex
      number: 6
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 4
    data_pins:
      red: [1, 2, 42, 41, 40]
      blue: [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]

output:
  - platform: ledc
    pin: GPIO06
    id: backlight_pwm
    frequency: 2000Hz
    channel: 0

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Screen Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: lbl_time
              text: !lambda |-
                auto t = id(ha_time).now();
                char buf[8];
                int hour = t.hour > 12 ? t.hour - 12 : (t.hour == 0 ? 12 : t.hour);
                snprintf(buf, sizeof(buf), "%d:%02d", hour, t.minute);
                return std::string(buf);

          - lvgl.label.update:
              id: lbl_ampm
              text: !lambda |-
                return id(ha_time).now().strftime("%p");

          - lvgl.label.update:
              id: lbl_date
              text: !lambda |-
                auto t = id(ha_time).now();
                char buf[32];
                const char* days[] = {"Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"};
                const char* months[] = {"Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"};
                snprintf(buf, sizeof(buf), "%s  %d %s", days[t.day_of_week - 1], t.day_of_month, months[t.month - 1]);
                return std::string(buf);

          - lvgl.label.update:
              id: hourly_header_time
              text: !lambda |-
                auto t = id(ha_time).now();
                char buf[12];
                int hour = t.hour > 12 ? t.hour - 12 : (t.hour == 0 ? 12 : t.hour);
                snprintf(buf, sizeof(buf), "%d:%02d %s", hour, t.minute, t.hour >= 12 ? "PM" : "AM");
                return std::string(buf);

          - lvgl.label.update:
              id: sun_header_time
              text: !lambda |-
                auto t = id(ha_time).now();
                char buf[12];
                int hour = t.hour > 12 ? t.hour - 12 : (t.hour == 0 ? 12 : t.hour);
                snprintf(buf, sizeof(buf), "%d:%02d %s", hour, t.minute, t.hour >= 12 ? "PM" : "AM");
                return std::string(buf);

          - script.execute: align_sun_deck
          - script.execute: update_sun_panel
          - script.execute: update_sun_page

# Pressure trend: keep ~3 hours of samples and compare newest vs oldest
globals:
  - id: weather_cond
    type: std::string
    restore_value: false
    initial_value: '"cloudy"'
  - id: pressure_history
    type: std::vector<float>
    restore_value: false
  - id: pressure_trend
    type: int          # -1 falling, 0 steady, 1 rising
    restore_value: false
    initial_value: "0"
  - id: fc_panel
    type: int          # main forecast box: 0 5-day, 1 hourly, 2 sun & moon
    restore_value: false
    initial_value: "0"
  # exact sunrise / sunset epoch seconds for the Sun page countdown (set by update_sun_page)
  - id: sun_cd_rise
    type: double
    restore_value: false
    initial_value: "0"
  - id: sun_cd_set
    type: double
    restore_value: false
    initial_value: "0"
  - id: sun_cd_rise_next
    type: double
    restore_value: false
    initial_value: "0"
  # seconds to add to the computed sea-level sunrise / sunset / noon so every time on
  # screen matches Home Assistant's sun.sun (which includes HA's elevation setting).
  # Set by update_sun_panel; stay 0 (plain computed times) until HA's values arrive.
  - id: sun_off_rise
    type: double
    restore_value: false
    initial_value: "0"
  - id: sun_off_set
    type: double
    restore_value: false
    initial_value: "0"
  - id: sun_off_noon
    type: double
    restore_value: false
    initial_value: "0"

interval:
  # Sun page countdown: only does anything while the Sun page is on screen
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(page_sun)->is_showing();'
          then:
            - script.execute: update_sun_countdown

  # Rotate the main-page forecast box every 15 seconds
  - interval: 15s
    then:
      - lambda: 'id(fc_panel) = (id(fc_panel) + 1) % 3;'
      - script.execute: show_fc_panel

  - interval: 15min
    then:
      - lambda: |-
          if (isnan(id(ha_pressure).state)) return;
          float inhg = id(ha_pressure).state * 0.0295299830714;
          auto &h = id(pressure_history);
          h.push_back(inhg);
          if (h.size() > 13) h.erase(h.begin());   // 13 samples x 15 min = 3 hours
          int trend = 0;
          if (h.size() >= 2) {
            float change = h.back() - h.front();
            if (change > 0.03) trend = 1;          // ~1 hPa
            else if (change < -0.03) trend = -1;
          }
          id(pressure_trend) = trend;
      - lvgl.label.update:
          id: equivalent_pressure_arrow
          text: !lambda |-
            if (id(pressure_trend) > 0) return "\U000F005C";
            if (id(pressure_trend) < 0) return "\U000F0043";
            return "\U000F0054";
          text_color: !lambda |-
            if (id(pressure_trend) > 0) return lv_color_hex(0x66BB6A);
            if (id(pressure_trend) < 0) return lv_color_hex(0xEF5350);
            return lv_color_hex(0xFFFFFF);

script:
  - id: update_forecast_rows
    then:
      # ========== Day 0 ==========
      - lvgl.label.update:
          id: main_day0_name
          text: "Today"
      - lvgl.label.update:
          id: main_day0_icon
          text: !lambda |-
            std::string c = id(fc0_cond).state;
            for (char &ch : c) ch = tolower(ch);
            if (c.find("fog") != std::string::npos || c.find("mist") != std::string::npos) return "\uF014";
            if (c.find("sunny") != std::string::npos || c.find("clear") != std::string::npos) return "\uF00D";
            if (c.find("partly") != std::string::npos) return "\uF002";
            if (c.find("cloud") != std::string::npos || c.find("overcast") != std::string::npos) return "\uF013";
            if (c.find("rain") != std::string::npos || c.find("pour") != std::string::npos || c.find("shower") != std::string::npos) return "\uF019";
            if (c.find("thunder") != std::string::npos || c.find("lightning") != std::string::npos || c.find("storm") != std::string::npos) return "\uF01E";
            if (c.find("snow") != std::string::npos) return "\uF01B";
            return "\uF013";
          text_color: !lambda |-
            std::string c = id(fc0_cond).state;
            for (char &ch : c) ch = tolower(ch);
            if (c.find("sunny") != std::string::npos || c.find("clear") != std::string::npos) return lv_color_hex(0xFFCC00);
            if (c.find("partly") != std::string::npos) return lv_color_hex(0xFFCC00);
            if (c.find("cloud") != std::string::npos || c.find("overcast") != std::string::npos) return lv_color_hex(0xAAAAAA);
            if (c.find("rain") != std::string::npos || c.find("pour") != std::string::npos || c.find("shower") != std::string::npos) return lv_color_hex(0x4FC3F7);
            if (c.find("thunder") != std::string::npos || c.find("lightning") != std::string::npos || c.find("storm") != std::string::npos) return lv_color_hex(0x7E57C2);
            if (c.find("snow") != std::string::npos) return lv_color_hex(0xE0E0E0);
            if (c.find("fog") != std::string::npos || c.find("mist") != std::string::npos) return lv_color_hex(0x90A4AE);
            return lv_color_hex(0xAAAAAA);
      - lvgl.label.update:
          id: main_day0_low
          text: !lambda 'return std::to_string((int)id(fc0_low).state) + "°";'
      - lvgl.label.update:
          id: main_day0_high
          text: !lambda 'return std::to_string((int)id(fc0_high).state) + "°";'
      - lvgl.bar.update:
          id: main_day0_bar
          value: !lambda 'return (int)id(fc0_high).state;'
      - lvgl.widget.update:
          id: main_day0_bar
          indicator:
            bg_color: !lambda |-
              int t = (int)id(fc0_high).state;
              if (t <= 40) return lv_color_hex(0x1565C0);
              if (t <= 55) return lv_color_hex(0x4FC3F7);
              if (t <= 70) return lv_color_hex(0x66BB6A);
              if (t <= 85) return lv_color_hex(0xFFAA00);
              return lv_color_hex(0xEF5350);
            bg_grad_dir: NONE

      # ========== Day 1 ==========
      - lvgl.label.update:
          id: main_day1_name
          text: !lambda |-
            static const char* days[] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
            int d = id(ha_time).now().day_of_week;
