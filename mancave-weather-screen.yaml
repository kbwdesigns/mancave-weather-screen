  style_definitions:
    - id: outdoor_style
      text_font: outdoor_font
      text_color: 0x00FF00
    - id: outdoor_style2
      text_font: outdoor_font2
      text_color: 0x00FF00
    - id: outdoor_style3
      text_font: outdoor_font3
      text_color: 0xAAAAAA
    - id: indoor_style
      text_font: indoor_font
      text_color: 0xFFD700
    - id: small_outdoor_style
      text_font: small_info_font
      text_color: 0x00FF00
      translate_y: -8
    - id: small_indoor_style
      text_font: small_info_font
      text_color: 0xFFD700
      translate_y: -8
    - id: mdi_style
      text_font: mdi_42
      text_color: 0x00FF00
      translate_y: -8

  pages:
    # ===================== BOOT SPLASH =====================
    - id: page_splash
      bg_color: 0x001C43
      scrollbar_mode: "OFF"
      widgets:
        - image:
            src: img_splash
            align: CENTER

    # ===================== MAIN PAGE =====================
    - id: page_main
      bg_color: 0x111111
      scrollbar_mode: "OFF"
      on_load:
        then:
          - script.execute: update_forecast_rows
          - script.execute: update_hourly_panels
          - script.execute: update_sun_panel
          - script.execute: show_fc_panel
          - script.execute: update_rain_line
