  # Daily precip chance on the main-page compact 5-day rows, from sensor.mancave_daily_precip
  # state: "p0|p1|p2|p3|p4" (ints, day 0 = today). Shown only when > 0; when shown,
  # the day name moves up 8 px and the % sits under it (rows without rain are unchanged).
  - id: update_daily_precip
    then:
      - lambda: |-
          lv_obj_t *names[5] = {id(main_day0_name), id(main_day1_name), id(main_day2_name), id(main_day3_name), id(main_day4_name)};
          lv_obj_t *pops[5] = {id(main_day0_pop), id(main_day1_pop), id(main_day2_pop), id(main_day3_pop), id(main_day4_pop)};
          std::string s = id(ha_daily_precip).state;
          bool valid = !(s.empty() || s == "unknown" || s == "unavailable");
          size_t pos = 0;
          for (int i = 0; i < 5; i++) {
            int v = -1;
            if (valid && pos <= s.size()) {
              size_t end = s.find('|', pos);
              if (end == std::string::npos) end = s.size();
              std::string fld = s.substr(pos, end - pos);
              pos = end + 1;
              if (!fld.empty()) {
                char *ep = nullptr;
                double d = strtod(fld.c_str(), &ep);
                if (ep != fld.c_str() && *ep == '\0' && !std::isnan(d)) v = (int) lround(d);
              }
            }
            if (v > 100) v = 100;
            int base = 16 + 48 * i;
            if (v > 0) {
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", v);
              lv_label_set_text(pops[i], buf);
              lv_obj_clear_flag(pops[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_y(names[i], base - 8);
            } else {
              lv_label_set_text(pops[i], "");
              lv_obj_add_flag(pops[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_y(names[i], base);
            }
          }

  # Rain line under the Indoor box (Ecowitt GW1100B). Shown only while event rain > 0.
  - id: update_rain_line
    then:
      - lambda: |-
          float ev = id(ha_event_rain).state;
          float rt = id(ha_rain_rate).state;
          if (std::isnan(ev) || ev <= 0.0f) {
            lv_obj_add_flag(id(rain_line), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          char buf[64];
          if (std::isnan(rt))
            snprintf(buf, sizeof(buf), "Event Rain %.2f in   Rate/Hr -- in", ev);
          else
            snprintf(buf, sizeof(buf), "Event Rain %.2f in   Rate/Hr %.2f in", ev, rt);
          lv_label_set_text(id(rain_line), buf);
          lv_obj_clear_flag(id(rain_line), LV_OBJ_FLAG_HIDDEN);

  - id: show_fc_panel
    then:
      - lambda: |-
          lv_obj_t *panels[3] = {id(fc_panel_5day), id(fc_panel_hourly), id(fc_panel_sun)};
          int p = id(fc_panel);
          if (p < 0 || p > 2) p = 0;
          for (int i = 0; i < 3; i++) {
            if (i == p) lv_obj_clear_flag(panels[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(panels[i], LV_OBJ_FLAG_HIDDEN);
          }

  # Hourly panel, from sensor.mancave_hourly_4h
  # state: "epoch|label|temp|condition|precip;epoch|label|..." (up to 4 entries)
  - id: update_hourly_panels
    then:
      - lambda: |-
          lv_obj_t *t_lbl[4] = {id(main_hr0_time), id(main_hr1_time), id(main_hr2_time), id(main_hr3_time)};
          lv_obj_t *i_lbl[4] = {id(main_hr0_icon), id(main_hr1_icon), id(main_hr2_icon), id(main_hr3_icon)};
          lv_obj_t *tp_lbl[4] = {id(main_hr0_temp), id(main_hr1_temp), id(main_hr2_temp), id(main_hr3_temp)};
          lv_obj_t *pp_lbl[4] = {id(main_hr0_pop), id(main_hr1_pop), id(main_hr2_pop), id(main_hr3_pop)};

          // ISO "2026-11-10T11:41:23+00:00" (UTC) -> epoch, 0 on failure
          auto iso_epoch = [](const std::string &iso) -> time_t {
            if (iso.size() < 19) return 0;
            int y = 0, mo = 0, d = 0, h = 0, mi = 0, s = 0;
            if (sscanf(iso.c_str(), "%d-%d-%dT%d:%d:%d", &y, &mo, &d, &h, &mi, &s) != 6) return 0;
            ESPTime utc{};
            utc.year = y; utc.month = mo; utc.day_of_month = d;
            utc.hour = h; utc.minute = mi; utc.second = s;
            utc.recalc_timestamp_utc(false);
            return utc.timestamp;
          };
          std::string sun = id(ha_sun_state).state;
          time_t next_rise = iso_epoch(id(ha_next_rising).state);
          time_t next_set = iso_epoch(id(ha_next_setting).state);

          // split state into up to 4 entries of 5 fields
          std::string s = id(ha_hourly4).state;
          bool valid = !(s.empty() || s == "unknown" || s == "unavailable");
          std::string f[4][5];
          int n = 0;
          size_t pos = 0;
          while (valid && n < 4 && pos <= s.size()) {
            size_t end = s.find(';', pos);
            if (end == std::string::npos) end = s.size();
            std::string e = s.substr(pos, end - pos);
            int k = 0;
            size_t p2 = 0;
            while (k < 5) {
              size_t bar = e.find('|', p2);
              if (bar == std::string::npos) { f[n][k++] = e.substr(p2); break; }
              f[n][k++] = e.substr(p2, bar - p2);
              p2 = bar + 1;
            }
            if (k == 5 && !f[n][1].empty()) n++;
            pos = end + 1;
          }

          for (int i = 0; i < 4; i++) {
            if (i >= n) {
              lv_label_set_text(t_lbl[i], "--");
              lv_label_set_text(i_lbl[i], "");
              lv_label_set_text(tp_lbl[i], "--°");
              lv_label_set_text(pp_lbl[i], "--%");
              continue;
            }
            int temp = atoi(f[i][2].c_str());
            int pop = atoi(f[i][4].c_str());
            if (pop < 0) pop = 0;
            if (pop > 100) pop = 100;
            char buf[16];

            lv_label_set_text(t_lbl[i], f[i][1].c_str());
            snprintf(buf, sizeof(buf), "%d°", temp);
            lv_label_set_text(tp_lbl[i], buf);
            snprintf(buf, sizeof(buf), "%d%%", pop);
            lv_label_set_text(pp_lbl[i], buf);

            // Day or night for the middle of this forecast hour, from sun.sun
            // (sun up now: day until next_setting; sun down now: day from next_rising).
            time_t mid = (time_t) atoll(f[i][0].c_str()) + 1800;
            bool is_day;
            if (sun == "above_horizon") is_day = (next_set == 0) || (mid < next_set);
            else if (sun == "below_horizon") is_day = (next_rise != 0) && (mid >= next_rise);
            else is_day = true;

            std::string c = f[i][3];
            for (char &ch : c) ch = tolower(ch);
            const char *glyph;
            uint32_t color;
            // night versions of clear / partly cloudy; the source says clear-night even in daytime
            if (c == "clear-night" || c == "sunny" || c == "clear") {
              if (is_day) { glyph = "\uF00D"; color = 0xFFCC00; }
              else { glyph = "\uF02E"; color = 0xCFD8DC; }
            } else if (c == "partlycloudy" || c == "partly-cloudy") {
              if (is_day) { glyph = "\uF002"; color = 0xFFCC00; }
              else { glyph = "\uF086"; color = 0xCFD8DC; }
            }
            // everything else: same mapping as the 5-day rows
            else if (c.find("fog") != std::string::npos || c.find("mist") != std::string::npos) { glyph = "\uF014"; color = 0x90A4AE; }
            else if (c.find("sunny") != std::string::npos || c.find("clear") != std::string::npos) { glyph = "\uF00D"; color = 0xFFCC00; }
            else if (c.find("partly") != std::string::npos) { glyph = "\uF002"; color = 0xFFCC00; }
            else if (c.find("cloud") != std::string::npos || c.find("overcast") != std::string::npos) { glyph = "\uF013"; color = 0xAAAAAA; }
            else if (c.find("rain") != std::string::npos || c.find("pour") != std::string::npos || c.find("shower") != std::string::npos) { glyph = "\uF019"; color = 0x4FC3F7; }
            else if (c.find("thunder") != std::string::npos || c.find("lightning") != std::string::npos || c.find("storm") != std::string::npos) { glyph = "\uF01E"; color = 0x7E57C2; }
            else if (c.find("snow") != std::string::npos) { glyph = "\uF01B"; color = 0xE0E0E0; }
            else { glyph = "\uF013"; color = 0xAAAAAA; }
            lv_label_set_text(i_lbl[i], glyph);
            lv_obj_set_style_text_color(i_lbl[i], lv_color_hex(color), LV_PART_MAIN);
          }

  # Sun & moon panel (sun.sun next_rising / next_setting / next_noon + sensor.moon)
  - id: update_sun_panel
    then:
      - lambda: |-
          auto iso_epoch = [](const std::string &iso) -> time_t {
            if (iso.size() < 19) return 0;
            int y = 0, mo = 0, d = 0, h = 0, mi = 0, s = 0;
            if (sscanf(iso.c_str(), "%d-%d-%dT%d:%d:%d", &y, &mo, &d, &h, &mi, &s) != 6) return 0;
            ESPTime utc{};
            utc.year = y; utc.month = mo; utc.day_of_month = d;
            utc.hour = h; utc.minute = mi; utc.second = s;
            utc.recalc_timestamp_utc(false);
            return utc.timestamp;
          };
          auto fmt = [](time_t ts, lv_obj_t *lbl) {
            if (ts == 0) { lv_label_set_text(lbl, "--:--"); return; }
            ESPTime local = ESPTime::from_epoch_local(ts);
            int hour = local.hour > 12 ? local.hour - 12 : (local.hour == 0 ? 12 : local.hour);
            char buf[16];
            snprintf(buf, sizeof(buf), "%d:%02d %s", hour, local.minute, local.hour >= 12 ? "PM" : "AM");
            lv_label_set_text(lbl, buf);
          };
          time_t rise = iso_epoch(id(ha_next_rising).state);
          time_t set = iso_epoch(id(ha_next_setting).state);
          time_t noon = iso_epoch(id(ha_next_noon).state);
          fmt(rise, id(main_sun_rise));
          fmt(set, id(main_sun_set));
          fmt(noon, id(main_sun_noon));
          // Day length for a LOCAL calendar date, NOAA solar equations,
          // sunrise/sunset at -0.833 deg altitude, at your latitude/longitude.
          // days since 1970-01-01 for a civil date (so "yesterday" is just days - 1, DST-proof)
          auto civil_days = [](int y, int m, int d) -> int {
            int yy = y - (m <= 2 ? 1 : 0);
            int era = (yy >= 0 ? yy : yy - 399) / 400;
            int yoe = yy - era * 400;
            int doy = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + d - 1;
            int doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
            return era * 146097 + doe - 719468;
          };
          // sunrise / noon / sunset in minutes after 0h UTC of that date
          auto rs_min = [](int days, double &rise, double &noon, double &set) {
            const double LAT = ${latitude}, LON = ${longitude};
            const double R = M_PI / 180.0;
            double jd0 = (double) days + 2440587.5;  // 0h UTC of that date
            auto ev = [&](double jd, double &decl, double &eot) {
              double T = (jd - 2451545.0) / 36525.0;
              double L0 = fmod(280.46646 + T * (36000.76983 + T * 0.0003032), 360.0);
              double M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
              double e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
              double C = sin(M * R) * (1.914602 - T * (0.004817 + 0.000014 * T)) +
                         sin(2 * M * R) * (0.019993 - 0.000101 * T) + sin(3 * M * R) * 0.000289;
              double om = 125.04 - 1934.136 * T;
              double lam = L0 + C - 0.00569 - 0.00478 * sin(om * R);
              double eps0 = 23.0 + (26.0 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60.0) / 60.0;
              double eps = eps0 + 0.00256 * cos(om * R);
              decl = asin(sin(eps * R) * sin(lam * R));
              double yv = tan(eps * R / 2) * tan(eps * R / 2);
              eot = 4.0 / R * (yv * sin(2 * L0 * R) - 2 * e * sin(M * R) + 4 * e * yv * sin(M * R) * cos(2 * L0 * R) -
                               0.5 * yv * yv * sin(4 * L0 * R) - 1.25 * e * e * sin(2 * M * R));
            };
            auto ha = [&](double decl) -> double {
              double x = cos(90.833 * R) / (cos(LAT * R) * cos(decl)) - tan(LAT * R) * tan(decl);
              if (x > 1) x = 1;
              if (x < -1) x = -1;
              return acos(x) / R;
            };
            double decl, eot;
            ev(jd0 + 0.5, decl, eot);
            rise = 720 - 4 * LON - eot - 4 * ha(decl);
            set = 720 - 4 * LON - eot + 4 * ha(decl);
            noon = 720 - 4 * LON - eot;
            for (int k = 0; k < 2; k++) {  // refine declination/EoT at the event times
              ev(jd0 + rise / 1440.0, decl, eot);
              rise = 720 - 4 * LON - eot - 4 * ha(decl);
              ev(jd0 + set / 1440.0, decl, eot);
              set = 720 - 4 * LON - eot + 4 * ha(decl);
              ev(jd0 + noon / 1440.0, decl, eot);
              noon = 720 - 4 * LON - eot;
            }
          };
          // Offsets (seconds) from the computed sea-level times to HA's sun.sun times.
          // HA's next_rising / next_setting / next_noon are always the NEXT event, so each
          // offset is measured on that event's own local date. Day-to-day the offset changes
          // by well under a second, so computed + offset matches HA for today and tomorrow.
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            auto off_for = [&](time_t ev_ts, int which, double &off) -> bool {
              if (ev_ts == 0) return false;   // HA value missing / unknown: keep the last offset
              ESPTime l = ESPTime::from_epoch_local(ev_ts);
              int d = civil_days(l.year, l.month, l.day_of_month);
              double r, n, s;
              rs_min(d, r, n, s);
              double m = which == 0 ? r : (which == 1 ? s : n);
              double o = (double) ev_ts - ((double) d * 86400.0 + m * 60.0);
              if (fabs(o) > 1800.0) return false;   // not a sensible match, ignore
              off = o;
              return true;
            };
            double o_r = id(sun_off_rise), o_s = id(sun_off_set), o_n = id(sun_off_noon);
            off_for(rise, 0, o_r);
            off_for(set, 1, o_s);
            off_for(noon, 2, o_n);
            if (o_r != id(sun_off_rise) || o_s != id(sun_off_set) || o_n != id(sun_off_noon)) {
              id(sun_off_rise) = o_r;
              id(sun_off_set) = o_s;
              id(sun_off_noon) = o_n;
              id(update_sun_page).execute();   // Sun page picks up HA's times right away
            }
          }
          // day length with HA's times (computed length + the HA set/rise offsets)
          auto day_len_s = [&](int days) -> double {
            double r, n, s;
            rs_min(days, r, n, s);
            return (s - r) * 60.0 + id(sun_off_set) - id(sun_off_rise);
          };
          // "9h 59m (−2m 17s)"  (U+2212 minus and '+' are in small_info_font)
          auto fmt_len = [](double today, double yday, char *buf, size_t n) {
            long lm = lround(today / 60.0);
            long dsec = lround(today - yday);
            const char *sign = dsec < 0 ? "\u2212" : "+";
            long a = labs(dsec);
            if (a >= 60) snprintf(buf, n, "%ldh %02ldm (%s%ldm %02lds)", lm / 60, lm % 60, sign, a / 60, a % 60);
            else snprintf(buf, n, "%ldh %02ldm (%s%lds)", lm / 60, lm % 60, sign, a);
          };
          if (now.is_valid()) {
            int today = civil_days(now.year, now.month, now.day_of_month);
            char buf[40];
            fmt_len(day_len_s(today), day_len_s(today - 1), buf, sizeof(buf));
            lv_label_set_text(id(main_sun_len), buf);
          } else {
            lv_label_set_text(id(main_sun_len), "--");
          }

          std::string m = id(ha_moon).state;
          struct P { const char *state; const char *name; const char *glyph; };
          static const P phases[] = {
            {"new_moon", "New Moon", "\U000F0F64"},
            {"waxing_crescent", "Waxing Crescent", "\U000F0F67"},
            {"first_quarter", "First Quarter", "\U000F0F61"},
            {"waxing_gibbous", "Waxing Gibbous", "\U000F0F68"},
            {"full_moon", "Full Moon", "\U000F0F62"},
            {"waning_gibbous", "Waning Gibbous", "\U000F0F66"},
            {"last_quarter", "Last Quarter", "\U000F0F63"},
            {"waning_crescent", "Waning Crescent", "\U000F0F65"},
          };
          const P *hit = nullptr;
          for (auto &p : phases) if (m == p.state) { hit = &p; break; }
          lv_label_set_text(id(main_moon_icon), hit ? hit->glyph : "");
          lv_label_set_text(id(main_moon_name), hit ? hit->name : "Moon --");

  # ===== Sun page countdown: shown only in the last hour before sunrise / sunset =====
  # Live M:SS timer, pulses in the final minute, hidden at the event and the rest of the day.
  - id: update_sun_countdown
    then:
      - lambda: |-
          lv_obj_t *lbl = id(sun_countdown);
          // pulse: label opacity 255 -> 70 -> 255 once a second (LVGL animation)
          static const lv_anim_exec_xcb_t PULSE = [](void *var, int32_t v) {
            lv_obj_set_style_opa((lv_obj_t *) var, (lv_opa_t) v, LV_PART_MAIN);
          };
          static int state = -1;      // 0 hidden, 1 shown, 2 shown + pulsing
          static long last_rem = -1;
          static bool last_up = false;
          auto now = id(ha_time).now();
          long rem = 0;
          bool up = false;
          if (now.is_valid() && id(sun_cd_set) > 0) {
            double ts = (double) now.timestamp;
            double target;
            if (ts < id(sun_cd_rise)) target = id(sun_cd_rise);              // before dawn
            else if (ts <= id(sun_cd_set)) { target = id(sun_cd_set); up = true; }  // sun up
            else target = id(sun_cd_rise_next);                              // after sunset
            rem = (long) ceil(target - ts);   // whole seconds left (0 at the event)
          }
          int want = (rem >= 1 && rem < 3600) ? (rem <= 60 ? 2 : 1) : 0;
          if (want != state) {
            if (state == 2 || state == -1) {
              lv_anim_delete(lbl, PULSE);
              lv_obj_set_style_opa(lbl, LV_OPA_COVER, LV_PART_MAIN);
            }
            if (want == 0) lv_obj_add_flag(lbl, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_clear_flag(lbl, LV_OBJ_FLAG_HIDDEN);
            if (want == 2) {
              lv_anim_t a;
              lv_anim_init(&a);
              lv_anim_set_var(&a, lbl);
              lv_anim_set_exec_cb(&a, PULSE);
              lv_anim_set_values(&a, LV_OPA_COVER, 70);
              lv_anim_set_duration(&a, 500);
              lv_anim_set_reverse_duration(&a, 500);
              lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
              lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
              lv_anim_start(&a);
            }
            state = want;
            last_rem = -1;
          }
          if (want == 0) return;
          if (up != last_up || last_rem == -1)
            lv_obj_set_style_text_color(lbl, lv_color_hex(up ? 0xFFAA00 : 0x90A4AE), LV_PART_MAIN);
          if (rem != last_rem || up != last_up) {
            char buf[32];
            snprintf(buf, sizeof(buf), "%s in %ld:%02ld", up ? "Sunset" : "Sunrise", rem / 60, rem % 60);
            lv_label_set_text(lbl, buf);
          }
          last_rem = rem;
          last_up = up;

  # ===== Sun page: NOAA solar position computed on the device =====
  # Path curves are rebuilt once per day; the sun position updates every minute.
  - id: update_sun_page
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          // ---- NOAA solar position (same equations as the day-length code) ----
          const double LAT = ${latitude}, LON = ${longitude};
          const double R = M_PI / 180.0;
          auto civil_days = [](int y, int m, int d) -> int {
            int yy = y - (m <= 2 ? 1 : 0);
            int era = (yy >= 0 ? yy : yy - 399) / 400;
            int yoe = yy - era * 400;
            int doy = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + d - 1;
            int doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
            return era * 146097 + doe - 719468;
          };
          // solar declination (rad) and equation of time (min) at a Julian day
          auto ev = [&](double jd, double &decl, double &eot) {
            double T = (jd - 2451545.0) / 36525.0;
            double L0 = fmod(280.46646 + T * (36000.76983 + T * 0.0003032), 360.0);
            double M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
            double e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
            double C = sin(M * R) * (1.914602 - T * (0.004817 + 0.000014 * T)) +
                       sin(2 * M * R) * (0.019993 - 0.000101 * T) + sin(3 * M * R) * 0.000289;
            double om = 125.04 - 1934.136 * T;
            double lam = L0 + C - 0.00569 - 0.00478 * sin(om * R);
            double eps0 = 23.0 + (26.0 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60.0) / 60.0;
            double eps = eps0 + 0.00256 * cos(om * R);
            decl = asin(sin(eps * R) * sin(lam * R));
            double yv = tan(eps * R / 2) * tan(eps * R / 2);
            eot = 4.0 / R * (yv * sin(2 * L0 * R) - 2 * e * sin(M * R) + 4 * e * yv * sin(M * R) * cos(2 * L0 * R) -
                             0.5 * yv * yv * sin(4 * L0 * R) - 1.25 * e * e * sin(2 * M * R));
          };
          // refracted elevation and azimuth (degrees, azimuth clockwise from north) at a unix time
          auto sun_pos = [&](double ts, double &el, double &az) {
            double decl, eot;
            ev(ts / 86400.0 + 2440587.5, decl, eot);
            double tst = fmod(fmod(ts, 86400.0) / 60.0 + eot + 4.0 * LON, 1440.0);
            if (tst < 0) tst += 1440.0;
            double H = tst / 4.0 - 180.0;
            double cz = sin(LAT * R) * sin(decl) + cos(LAT * R) * cos(decl) * cos(H * R);
            if (cz > 1) cz = 1;
            if (cz < -1) cz = -1;
            double z = acos(cz);
            double e = 90.0 - z / R;
            double rf = 0;  // NOAA atmospheric refraction approximation (arcsec)
            if (e <= 85.0) {
              double te = tan(e * R);
              if (e > 5.0) rf = 58.1 / te - 0.07 / (te * te * te) + 0.000086 / pow(te, 5);
              else if (e > -0.575) rf = 1735.0 + e * (-518.2 + e * (103.4 + e * (-12.79 + e * 0.711)));
              else rf = -20.772 / te;
            }
            el = e + rf / 3600.0;
            double den = cos(LAT * R) * sin(z);
            if (fabs(den) < 1e-9) { az = 180.0; return; }
            double c = (sin(LAT * R) * cz - sin(decl)) / den;
            if (c > 1) c = 1;
            if (c < -1) c = -1;
            double a = acos(c) / R;
            az = H > 0 ? fmod(a + 180.0, 360.0) : fmod(540.0 - a, 360.0);
          };
          // sunrise / solar noon / sunset (unix time) for a local civil date (days since 1970-01-01)
          auto rise_set = [&](int days, double &rise_ts, double &noon_ts, double &set_ts) {
            auto ha = [&](double decl) -> double {
              double x = cos(90.833 * R) / (cos(LAT * R) * cos(decl)) - tan(LAT * R) * tan(decl);
              if (x > 1) x = 1;
              if (x < -1) x = -1;
              return acos(x) / R;
            };
            double jd0 = (double) days + 2440587.5;  // 0h UTC of that date
            double decl, eot;
            ev(jd0 + 0.5, decl, eot);
            double rise = 720 - 4 * LON - eot - 4 * ha(decl);
            double set = 720 - 4 * LON - eot + 4 * ha(decl);
            double noon = 720 - 4 * LON - eot;
            for (int k = 0; k < 2; k++) {  // refine at the event times
              ev(jd0 + rise / 1440.0, decl, eot);
              rise = 720 - 4 * LON - eot - 4 * ha(decl);
              ev(jd0 + set / 1440.0, decl, eot);
              set = 720 - 4 * LON - eot + 4 * ha(decl);
              ev(jd0 + noon / 1440.0, decl, eot);
              noon = 720 - 4 * LON - eot;
            }
            double base = (double) days * 86400.0;
            rise_ts = base + rise * 60.0;
            noon_ts = base + noon * 60.0;
            set_ts = base + set * 60.0;
          };
          // ---- chart geometry (pixels inside sun_chart, 520x355) ----
          const int PL = 44, PR = 505, PT = 30, HY = 285;
          const double EL_MAX = 75.0, AZ0 = 45.0, AZ1 = 315.0;
          auto X = [&](double az) -> int {
            if (az < AZ0) az = AZ0;
            if (az > AZ1) az = AZ1;
            return (int) lround(PL + (az - AZ0) * (PR - PL) / (AZ1 - AZ0));
          };
          auto Y = [&](double el) -> int {
            if (el < 0) el = 0;
            if (el > EL_MAX) el = EL_MAX;
            return (int) lround(HY - el * (HY - PT) / EL_MAX);
          };
          auto fmt_time = [](double ts, char *b, size_t n) {
            ESPTime t = ESPTime::from_epoch_local((time_t) ts);
            int h = t.hour % 12 == 0 ? 12 : t.hour % 12;
            snprintf(b, n, "%d:%02d %s", h, t.minute, t.hour >= 12 ? "PM" : "AM");
          };
          const int NP = 61;   // points per path curve
          const int NR = 25;   // points on the compass daylight arc
          const int CX = 125, CY = 235, CR = 50;  // compass centre/radius inside sun_box
          static lv_point_precise_t p_today[NP], p_summer[NP], p_winter[NP], p_done[NP + 1];
          static lv_point_precise_t p_drop[2], p_needle[2], p_ring[NR];
          static int last_days = -1;
          static double rise_ts = 0, noon_ts = 0, set_ts = 0;   // computed (path geometry)
          // displayed times = computed + offset to HA's sun.sun (whole seconds)
          const double off_r = id(sun_off_rise), off_s = id(sun_off_set), off_n = id(sun_off_noon);
          auto ha_t = [](double t, double off) -> double { return floor(t + off + 0.5); };
          static double last_off_r = 0, last_off_s = 0, last_off_n = 0;
          static int night_x = 10, night_y = -1;  // night message spot (-1 = one line in the top strip)
          char buf[48];
          int days = civil_days(now.year, now.month, now.day_of_month);

          // ---- once a day: today's path, solstice paths, rise/set/max labels ----
          if (days != last_days || off_r != last_off_r || off_s != last_off_s || off_n != last_off_n) {
            last_days = days;
            last_off_r = off_r;
            last_off_s = off_s;
            last_off_n = off_n;
            auto fill_path = [&](int d, lv_point_precise_t *pts) {
              double r, n, s;
              rise_set(d, r, n, s);
              for (int k = 0; k < NP; k++) {
                double el, az;
                sun_pos(r + (s - r) * k / (NP - 1), el, az);
                pts[k].x = X(az);
                pts[k].y = Y(el);
              }
            };
            rise_set(days, rise_ts, noon_ts, set_ts);
            fill_path(days, p_today);
            fill_path(civil_days(now.year, 6, 21), p_summer);
            fill_path(civil_days(now.year, 12, 21), p_winter);
            lv_line_set_points(id(sun_path_today)->obj, p_today, NP);
            lv_line_set_points(id(sun_path_summer)->obj, p_summer, NP);
            lv_line_set_points(id(sun_path_winter)->obj, p_winter, NP);
            lv_obj_set_pos(id(sun_lbl_summer), 78, 92);  // fixed spot in open sky left of the Jun arc
            lv_obj_set_pos(id(sun_lbl_winter), (int) p_winter[NP / 2].x - 30, (int) p_winter[NP / 2].y + 6);

            double el, az, raz, saz;
            sun_pos(rise_ts, el, raz);
            sun_pos(set_ts, el, saz);
            snprintf(buf, sizeof(buf), "Rise %d\u00B0", (int) lround(raz));
            lv_label_set_text(id(sun_lbl_rise), buf);
            lv_obj_set_pos(id(sun_lbl_rise), std::max(2, X(raz) - 16), HY + 32);
            snprintf(buf, sizeof(buf), "Set %d\u00B0", (int) lround(saz));
            lv_label_set_text(id(sun_lbl_set), buf);
            lv_obj_set_pos(id(sun_lbl_set), std::min(520 - 2 - 110, X(saz) + 16 - 110), HY + 32);

            sun_pos(noon_ts, el, az);
            char tb[16];
            fmt_time(ha_t(noon_ts, off_n), tb, sizeof(tb));
            snprintf(buf, sizeof(buf), "Max %.1f\u00B0 at %s", el, tb);
            lv_label_set_text(id(sun_lbl_apex), buf);
            lv_obj_set_pos(id(sun_lbl_apex), X(az) - 120, std::max(2, Y(el) - 30));

            // Night message spot. Normally one line in the empty strip above every path (y 4..32).
            // Around midsummer the Max label sits up there, so find a clear 2-line box inside the
            // Jun 21 arc that misses all three paths and the Max / Jun 21 / Dec 21 labels.
            {
              int ax = X(az), ay = std::max(2, Y(el) - 30);
              night_y = -1;
              if (ay < 40) {
                const int W = 204, HH = 58, M = 6;
                const lv_point_precise_t *paths[3] = {p_today, p_summer, p_winter};
                const int sx = (int) p_summer[NP / 2].x, sy = (int) p_summer[NP / 2].y;
                const int wx = (int) p_winter[NP / 2].x, wy = (int) p_winter[NP / 2].y;
                const int bx[3][4] = {{ax - 93, ay, ax + 93, ay + 22},
                                      {sx + 10, sy - 4, sx + 66, sy + 18},
                                      {wx - 30, wy + 6, wx + 26, wy + 28}};
                const int cx = (int) p_today[NP / 2].x;
                const int x0 = cx - W / 2 - M, x1 = cx + W / 2 + M;
                for (int y = 4; y < HY - HH - 4 && night_y < 0; y += 2) {
                  const int y0 = y - M, y1 = y + HH + M;
                  bool ok = true;
                  for (int b = 0; b < 3 && ok; b++)
                    if (!(x1 < bx[b][0] || x0 > bx[b][2] || y1 < bx[b][1] || y0 > bx[b][3])) ok = false;
                  for (int p = 0; p < 3 && ok; p++)
                    for (int k = 0; k + 1 < NP && ok; k++)
                      for (int j = 0; j < 4 && ok; j++) {
                        float px = (float) paths[p][k].x + ((float) paths[p][k + 1].x - (float) paths[p][k].x) * j / 4.0f;
                        float py = (float) paths[p][k].y + ((float) paths[p][k + 1].y - (float) paths[p][k].y) * j / 4.0f;
                        if (px >= x0 && px <= x1 && py >= y0 && py <= y1) ok = false;
                      }
                  if (ok) {
                    night_y = y;
                    night_x = cx - 150;
                  }
                }
              }
            }

            long lm = lround(((set_ts + off_s) - (rise_ts + off_r)) / 60.0);
            snprintf(buf, sizeof(buf), "Day length  %ldh %02ldm", lm / 60, lm % 60);
            lv_label_set_text(id(sun_daylen), buf);

            // daylight arc on the compass ring, sunrise azimuth -> sunset azimuth
            for (int k = 0; k < NR; k++) {
              double a = (raz + (saz - raz) * k / (NR - 1)) * R;
              p_ring[k].x = (int) lround(CX + CR * sin(a));
              p_ring[k].y = (int) lround(CY - CR * cos(a));
            }
            lv_line_set_points(id(sun_ring_day)->obj, p_ring, NR);
          }

          // ---- every minute: current position ----
          double ts = (double) now.timestamp;
          double el, az;
          sun_pos(ts, el, az);
          const double rise_ha = ha_t(rise_ts, off_r), set_ha = ha_t(set_ts, off_s);
          bool up = ts >= rise_ha && ts <= set_ha;

          snprintf(buf, sizeof(buf), "%.1f\u00B0", el);
          lv_label_set_text(id(sun_el_val), buf);
          lv_obj_set_style_text_color(id(sun_el_val), lv_color_hex(up ? 0xFFCC00 : 0x90A4AE), LV_PART_MAIN);
          static const char *dirs[] = {"N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE",
                                        "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"};
          snprintf(buf, sizeof(buf), "%d\u00B0 %s", ((int) lround(az)) % 360, dirs[((int) ((az + 11.25) / 22.5)) % 16]);
          lv_label_set_text(id(sun_az_val), buf);

          const char *phase;
          if (el >= 6.0) phase = "Daylight";
          else if (up) phase = "Golden hour";
          else if (el > -6.0) phase = "Civil twilight";
          else if (el > -12.0) phase = "Nautical twilight";
          else if (el > -18.0) phase = "Astronomical twilight";
          else phase = "Night";
          lv_label_set_text(id(sun_phase), phase);

          if (up && el > 0.5) {
            double ratio = 1.0 / tan(el * R);
            if (ratio < 10) snprintf(buf, sizeof(buf), "Shadow  %.1f\u00D7 height", ratio);
            else snprintf(buf, sizeof(buf), "Shadow  %.0f\u00D7 height", ratio);
          } else {
            snprintf(buf, sizeof(buf), "Shadow  --");
          }
          lv_label_set_text(id(sun_shadow), buf);

          // compass needle (dim when the sun is down)
          double a = az * R;
          p_needle[0].x = CX;
          p_needle[0].y = CY;
          p_needle[1].x = (int) lround(CX + (CR - 6) * sin(a));
          p_needle[1].y = (int) lround(CY - (CR - 6) * cos(a));
          lv_line_set_points(id(sun_needle)->obj, p_needle, 2);
          lv_obj_set_style_line_color(id(sun_needle)->obj, lv_color_hex(up ? 0xFFCC00 : 0x607D8B), LV_PART_MAIN);
          lv_obj_set_pos(id(sun_needle_dot), (int) lround(CX + CR * sin(a)) - 7, (int) lround(CY - CR * cos(a)) - 7);
          lv_obj_set_style_bg_color(id(sun_needle_dot), lv_color_hex(up ? 0xFFCC00 : 0x607D8B), LV_PART_MAIN);
          lv_obj_set_style_shadow_opa(id(sun_needle_dot), up ? LV_OPA_80 : LV_OPA_TRANSP, LV_PART_MAIN);

          if (up) {
            int x = X(az), y = Y(el);
            lv_obj_set_pos(id(sun_dot), x - 11, y - 11);
            lv_obj_clear_flag(id(sun_dot), LV_OBJ_FLAG_HIDDEN);
            // travelled part of today's path, ending at the sun
            int kk = (int) floor((ts - rise_ts) / (set_ts - rise_ts) * (NP - 1));
            if (kk < 0) kk = 0;
            if (kk > NP - 1) kk = NP - 1;
            for (int k = 0; k <= kk; k++) p_done[k] = p_today[k];
            p_done[kk + 1].x = x;
            p_done[kk + 1].y = y;
            lv_line_set_points(id(sun_path_done)->obj, p_done, kk + 2);
            lv_obj_clear_flag(id(sun_path_done)->obj, LV_OBJ_FLAG_HIDDEN);
            if (HY - y > 16) {
              p_drop[0].x = x;
              p_drop[0].y = y + 12;
              p_drop[1].x = x;
              p_drop[1].y = HY;
              lv_line_set_points(id(sun_drop)->obj, p_drop, 2);
              lv_obj_clear_flag(id(sun_drop)->obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(sun_drop)->obj, LV_OBJ_FLAG_HIDDEN);
            }
            lv_obj_add_flag(id(sun_lbl_below), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(sun_dot), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(sun_path_done)->obj, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(sun_drop)->obj, LV_OBJ_FLAG_HIDDEN);
            double nr = rise_ha, nn, ns;
            if (ts > set_ha) { rise_set(days + 1, nr, nn, ns); nr = ha_t(nr, off_r); }
            char tb[16];
            fmt_time(nr, tb, sizeof(tb));
            if (night_y < 0) {
              snprintf(buf, sizeof(buf), "Sun below horizon, rises %s", tb);
              lv_obj_set_width(id(sun_lbl_below), 500);
              lv_obj_set_pos(id(sun_lbl_below), 10, 4);
            } else {
              snprintf(buf, sizeof(buf), "Sun below horizon\nRises %s", tb);
              lv_obj_set_width(id(sun_lbl_below), 300);
              lv_obj_set_pos(id(sun_lbl_below), night_x, night_y);
            }
            lv_label_set_text(id(sun_lbl_below), buf);
            lv_obj_clear_flag(id(sun_lbl_below), LV_OBJ_FLAG_HIDDEN);
          }

          // ---- event times for the live countdown (update_sun_countdown, every second) ----
          // Same next-event rule as the night message: today's sunrise before dawn, today's
          // sunset while the sun is up, tomorrow's sunrise after sunset.
          {
            static int cd_days = -1;
            static double next_rise = 0;
            if (cd_days != days) {
              cd_days = days;
              double nn, ns;
              rise_set(days + 1, next_rise, nn, ns);
            }
            id(sun_cd_rise) = rise_ha;
            id(sun_cd_set) = set_ha;
            id(sun_cd_rise_next) = ha_t(next_rise, off_r);
          }



