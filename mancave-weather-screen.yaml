      "\uF00D", "\uF002", "\uF013", "\uF008", "\uF019",
      "\uF01E", "\uF01B", "\uF014"
    ]

  - file: 'fonts/weathericons-regular-webfont.ttf'
    id: weather_font_sm
    size: 36
    bpp: 4
    glyphs: [
      "\uF00D", "\uF002", "\uF013", "\uF008", "\uF019",
      "\uF01E", "\uF01B", "\uF014",
      "\uF02E", "\uF086"
