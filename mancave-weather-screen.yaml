            return lv_color_hex(0xAAAAAA);
      - lvgl.label.update:
          id: main_day3_low
          text: !lambda 'return std::to_string((int)id(fc3_low).state) + "°";'
      - lvgl.label.update:
          id: main_day3_high
          text: !lambda 'return std::to_string((int)id(fc3_high).state) + "°";'
      - lvgl.bar.update:
